[build-system]
requires = ["hatchling", "Flask>=2.2"]
build-backend = "hatchling.build"

[project]
name = "flask-alpine"
dynamic = ["version"]
description = "Offline-ready Alpine.js integration for Flask: zero JavaScript setup, no CDN."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Flask>=2.2"]
keywords = ["flask", "alpine", "alpinejs", "javascript", "extension"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff"]

[tool.hatch.version]
path = "src/flask_alpine/__init__.py"

[tool.hatch.build]
# vendored files are generated by the build hook, so never let VCS ignores drop them
artifacts = ["src/flask_alpine/static/**", "src/flask_alpine/manifest.json"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flask_alpine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Alpine.js assets:UserWarning"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
